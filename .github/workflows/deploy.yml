name: CI/CD Pipeline to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # 🤖 Chatbot X (Twitter) OAuth 2.0 (Client ID & Client Secret) - Báo cáo THÀNH CÔNG
      - name: Send X (Twitter) DM Chatbot Report on Success
        if: success()
        env:
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_RECIPIENT_ID: ${{ secrets.X_RECIPIENT_ID }}
        run: |
          if [ -n "$X_CLIENT_ID" ] && [ -n "$X_CLIENT_SECRET" ] && [ -n "$X_RECIPIENT_ID" ]; then
            TOKEN_RES=$(curl -s -u "$X_CLIENT_ID:$X_CLIENT_SECRET" \
              -X POST "https://api.twitter.com/2/oauth2/token" \
              -d "grant_type=client_credentials")
            ACCESS_TOKEN=$(echo "$TOKEN_RES" | jq -r '.access_token // empty')
            if [ -z "$ACCESS_TOKEN" ]; then
              ACCESS_TOKEN=$(echo "$TOKEN_RES" | grep -o '"access_token":"[^"]*' | grep -o '[^"]*$')
            fi
            
            MSG="🚀 [CI/CD DEPLOYMENT REPORT]\n\n🟢 Trạng thái: THÀNH CÔNG (SUCCESS)\n📌 Dự án: Next.js App\n🌿 Nhánh: ${GITHUB_REF_NAME}\n👤 Tác giả: ${GITHUB_ACTOR}\n🌐 Vercel URL: https://devops-minhhieu-st-23-a.vercel.app\n🐙 Repository: https://github.com/${GITHUB_REPOSITORY}"
            curl -X POST "https://api.twitter.com/2/dm_conversations/with/$X_RECIPIENT_ID/messages" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"message\": {\"text\": \"$MSG\"}}"
          fi

      # 🤖 Chatbot X (Twitter) OAuth 2.0 (Client ID & Client Secret) - Báo cáo THẤT BẠI
      - name: Send X (Twitter) DM Chatbot Report on Failure
        if: failure()
        env:
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_RECIPIENT_ID: ${{ secrets.X_RECIPIENT_ID }}
        run: |
          if [ -n "$X_CLIENT_ID" ] && [ -n "$X_CLIENT_SECRET" ] && [ -n "$X_RECIPIENT_ID" ]; then
            TOKEN_RES=$(curl -s -u "$X_CLIENT_ID:$X_CLIENT_SECRET" \
              -X POST "https://api.twitter.com/2/oauth2/token" \
              -d "grant_type=client_credentials")
            ACCESS_TOKEN=$(echo "$TOKEN_RES" | jq -r '.access_token // empty')
            if [ -z "$ACCESS_TOKEN" ]; then
              ACCESS_TOKEN=$(echo "$TOKEN_RES" | grep -o '"access_token":"[^"]*' | grep -o '[^"]*$')
            fi

            MSG="❌ [CI/CD DEPLOYMENT REPORT]\n\n🔴 Trạng thái: THẤT BẠI (FAILURE)\n📌 Dự án: Next.js App\n🌿 Nhánh: ${GITHUB_REF_NAME}\n👤 Tác giả: ${GITHUB_ACTOR}\n🐙 Repository: https://github.com/${GITHUB_REPOSITORY}"
            curl -X POST "https://api.twitter.com/2/dm_conversations/with/$X_RECIPIENT_ID/messages" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"message\": {\"text\": \"$MSG\"}}"
          fi
