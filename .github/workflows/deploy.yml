name: CI/CD Pipeline to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts for Vercel
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # 📩 Gửi tin nhắn riêng (DM) qua X (Twitter) khi Deploy THÀNH CÔNG
      - name: Send Direct Message on Success via X (Twitter)
        if: success() && secrets.X_BEARER_TOKEN != '' && secrets.X_RECIPIENT_ID != ''
        run: |
          curl -X POST "https://api.twitter.com/2/dm_conversations/with/${{ secrets.X_RECIPIENT_ID }}/messages" \
            -H "Authorization: Bearer ${{ secrets.X_BEARER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"message": {"text": "🎉 [GitHub Actions] Deploy dự án Next.js lên Vercel THÀNH CÔNG!"}}'

      # 📩 Gửi tin nhắn riêng (DM) qua X (Twitter) khi Deploy THẤT BẠI
      - name: Send Direct Message on Failure via X (Twitter)
        if: failure() && secrets.X_BEARER_TOKEN != '' && secrets.X_RECIPIENT_ID != ''
        run: |
          curl -X POST "https://api.twitter.com/2/dm_conversations/with/${{ secrets.X_RECIPIENT_ID }}/messages" \
            -H "Authorization: Bearer ${{ secrets.X_BEARER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"message": {"text": "❌ [GitHub Actions] Deploy dự án Next.js lên Vercel THẤT BẠI!"}}'
