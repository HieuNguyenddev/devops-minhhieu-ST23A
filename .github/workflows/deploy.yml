name: CI/CD Pipeline to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts for Vercel
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # 🔔 Gửi thông báo đến Zalo khi deploy thành công
      - name: Notify Zalo on Success
        if: success() && secrets.ZALO_WEBHOOK_URL != ''
        run: |
          curl -X POST "${{ secrets.ZALO_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text": "🎉 [GitHub Actions] Deploy ứng dụng Next.js lên Vercel THÀNH CÔNG!"}'

      # 🔔 Gửi thông báo đến X (Twitter) khi deploy thành công
      - name: Notify X (Twitter) on Success
        if: success() && secrets.X_BEARER_TOKEN != ''
        run: |
          curl -X POST "https://api.twitter.com/2/tweets" \
            -H "Authorization: Bearer ${{ secrets.X_BEARER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"text": "🚀 [GitHub Actions] Triển khai thành công dự án Next.js lên Vercel!"}'
